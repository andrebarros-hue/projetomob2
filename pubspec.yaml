name: ciclo
description: Ciclo — hábitos leves para uma rotina mais consciente.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ciclo_core:
    path: packages/ciclo_core
  ciclo_design_system:
    path: packages/ciclo_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit-400.ttf
          weight: 400
        - asset: assets/fonts/outfit-500.ttf
          weight: 500
        - asset: assets/fonts/outfit-600.ttf
          weight: 600
        - asset: assets/fonts/outfit-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/fraunces-700.ttf
          weight: 700
